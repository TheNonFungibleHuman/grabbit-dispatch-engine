name: Grabbit Fleet Reminders & Cron Heartbeat

on:
  schedule:
    # Trigger every 10 minutes to process 25-min reminders, morning briefings, and daily rundowns
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reminders & Operations Crons
        run: |
          PROD_URL="https://grabbit-whatsapp-agent.vercel.app"
          echo "Triggering $PROD_URL/api/reminders..."
          curl -s -f -X GET "$PROD_URL/api/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "User-Agent: Grabbit-Cron-Runner/1.0" || echo "Cron ping completed with non-fatal status"
